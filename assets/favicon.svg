<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 真上から見た小赤。16 画素でも「赤い金魚」と読めるところまで削ってある -->
  <rect width="32" height="32" rx="7" fill="#8fd3e4"/>
  <!-- 水面の揺らぎ -->
  <path d="M2 23c5-2 8 2 13 0s9-3 15-1v10H2z" fill="#6fc2d8" opacity=".55"/>
  <!-- 尾びれ。真上から見ると胴と同じくらい広がる -->
  <path d="M8.5 16c-3.2-3.4-6-4.6-6.3-4.2-.3.5 1.1 2.3 1.4 4.2-.3 1.9-1.7 3.7-1.4 4.2.3.4 3.1-.8 6.3-4.2z" fill="#d8511f"/>
  <!-- 胴 -->
  <ellipse cx="18.5" cy="16" rx="10.5" ry="6" fill="#e2561f"/>
  <!-- 背。真上から見ると背筋が濃い -->
  <ellipse cx="18.5" cy="14.4" rx="9.2" ry="2.6" fill="#b83c11" opacity=".55"/>
  <!-- 胸びれ -->
  <path d="M19 21.5c-1.6 1.9-3.8 2.8-4 2.4-.2-.4 1-1.7 1.4-3z" fill="#d8511f"/>
  <path d="M19 10.5c-1.6-1.9-3.8-2.8-4-2.4-.2.4 1 1.7 1.4 3z" fill="#d8511f"/>
  <!-- 目 -->
  <circle cx="26" cy="14.6" r="1.5" fill="#2b1206"/>
  <circle cx="26.5" cy="14.1" r=".5" fill="#fff" opacity=".85"/>
</svg>
