<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金魚掬い</title>
<meta name="description" content="水面を Tessendorf の波スペクトルから GPU 上の FFT で毎フレーム逆変換している、WebGL2 の金魚掬い。A WebGL2 goldfish-scooping game whose water is solved every frame by an FFT on the GPU.">
<meta name="theme-color" content="#e8e2d6">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="canonical" href="https://kanade0525.github.io/kingyo-sukui/">
<!-- 共有したときに出る絵と文。画像はこのアプリ自身を描画して書き出したもの -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="金魚掬い — Goldfish Scooping">
<meta property="og:title" content="金魚掬い — Goldfish Scooping">
<meta property="og:description" content="水面を GPU 上の FFT で解いている WebGL2 の金魚掬い。開いた時刻と現在地の天気を映します。 / A WebGL2 goldfish scoop. The water is an FFT ocean; the light follows the real sun for your date and place.">
<meta property="og:url" content="https://kanade0525.github.io/kingyo-sukui/">
<meta property="og:image" content="https://kanade0525.github.io/kingyo-sukui/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="水色のプラスチックのトロ舟に小赤が泳ぎ、睡蓮の浮き葉と赤いポイ、浮かべたお椀が見える / Small red goldfish in a pale blue plastic tray, with lily pads, a red paper scoop and a floating bowl">
<meta property="og:locale" content="ja_JP">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="金魚掬い — Goldfish Scooping">
<meta name="twitter:description" content="水面を GPU 上の FFT で解いている WebGL2 の金魚掬い。時刻と天気は現在地を映します。 / A WebGL2 goldfish scoop with an FFT ocean surface.">
<meta name="twitter:image" content="https://kanade0525.github.io/kingyo-sukui/assets/og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kaisei+Decol:wght@400;700&family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/app.css?v=202610041317">
</head>
<body>

<canvas id="scene"></canvas>

<div id="fallback" hidden>
  <div>
    <h2 data-t="noWebgl">WebGL2 が使えません</h2>
    <p class="lede" id="fallbackWhy" data-t="noWebglWhy">別のブラウザでお試しください。</p>
  </div>
</div>

<!-- 画面右上の札。いまの場所・天気・気温・時刻を出して、
     この絵が現実とつながっていることが分かるようにする -->
<div id="nowbar" hidden>
  <div id="nowWhat"></div>
  <div id="nowPlace"></div>
  <div id="nowSky"></div>
  <div id="nowTime"></div>
</div>

<div id="botbar">
  <a id="by" href="https://kanade0525.github.io/portfolio/" target="_blank" rel="noopener"
     data-t-aria="byAria">KANADE ISHIDA</a>
  <div id="tools">
    <button id="btnSound" aria-pressed="true" data-t-aria="soundToggle"><span id="soundMark">♪</span></button>
    <button id="btnPanel" aria-expanded="false" aria-controls="panel" data-t="settings">設定</button>
  </div>
</div>

<div id="panel" hidden>
  <h3 data-t="hLight">光</h3>
  <div class="row">
    <label class="rl" for="hour"><span data-t="time">時刻</span><span id="hourOut">--:--</span></label>
    <input type="range" id="hour" min="0" max="24" step="0.25" value="14.5">
  </div>
  <div class="row">
    <div class="rl"><span data-t="weather">天気</span><span id="wxNote" data-t="here">現在地</span></div>
    <div class="seg" id="segWx">
      <button type="button" data-w="0" aria-pressed="true" data-t="wxClear">晴れ</button><button type="button" data-w="1" data-t="wxCloudy">くもり</button><button type="button" data-w="2" data-t="wxRain">雨</button>
    </div>
  </div>
  <div class="row">
    <button type="button" id="btnNow" class="wide" data-t="backToNow">いまの時刻と天気に戻す</button>
  </div>
  <h3 data-t="hSound">音</h3>
  <div class="row">
    <div class="rl"><span data-t="recLayers">音の出どころ</span><span id="srcNote" data-t="recorded">録音</span></div>
    <div class="seg" id="segSrc">
      <button type="button" data-s="rec" aria-pressed="true" data-t="recorded">録音</button><button type="button" data-s="synth" data-t="synth">合成</button>
    </div>
  </div>
  <div class="row tight">
    <label class="rl" for="v_master"><span data-t="vMaster">全体</span><span id="o_master">100</span></label>
    <input type="range" id="v_master" min="0" max="200" step="5" value="100">
  </div>
  <div class="row tight">
    <label class="rl" for="v_pump"><span data-t="vPump">ポンプ</span><span id="o_pump">100</span></label>
    <input type="range" id="v_pump" min="0" max="200" step="5" value="100">
  </div>
  <div class="row tight">
    <label class="rl" for="v_cicada"><span data-t="vCicada">あぶらぜみ</span><span id="o_cicada">100</span></label>
    <input type="range" id="v_cicada" min="0" max="200" step="5" value="100">
  </div>
  <div class="row tight">
    <label class="rl" for="v_dusk"><span data-t="vDusk">夕方のせみ</span><span id="o_dusk">100</span></label>
    <input type="range" id="v_dusk" min="0" max="200" step="5" value="100">
  </div>
  <div class="row tight">
    <label class="rl" for="v_furin"><span data-t="vFurin">風鈴</span><span id="o_furin">100</span></label>
    <input type="range" id="v_furin" min="0" max="200" step="5" value="100">
  </div>
  <div class="row tight">
    <label class="rl" for="v_festival"><span data-t="vFestival">祭囃子</span><span id="o_festival">100</span></label>
    <input type="range" id="v_festival" min="0" max="200" step="5" value="100">
  </div>
  <div class="row tight">
    <label class="rl" for="v_crowd"><span data-t="vCrowd">ざわめき</span><span id="o_crowd">100</span></label>
    <input type="range" id="v_crowd" min="0" max="200" step="5" value="100">
  </div>
  <div class="row tight">
    <label class="rl" for="v_insect"><span data-t="vInsect">虫</span><span id="o_insect">100</span></label>
    <input type="range" id="v_insect" min="0" max="200" step="5" value="100">
  </div>
  <div class="row tight">
    <label class="rl" for="v_rain"><span data-t="vRain">雨</span><span id="o_rain">100</span></label>
    <input type="range" id="v_rain" min="0" max="200" step="5" value="100">
  </div>
  <h3 data-t="hWater">水面</h3>
  <div class="row">
    <label class="rl" for="amp"><span data-t="amp">波の高さ</span><span id="ampOut">0.10</span></label>
    <input type="range" id="amp" min="0" max="250" step="5" value="10">
  </div>
  <div class="row">
    <label class="rl" for="wind"><span data-t="wind">風速</span><span id="windOut">0.34 m/s</span></label>
    <input type="range" id="wind" min="25" max="150" step="1" value="34">
  </div>
  <div class="row">
    <div class="rl"><span data-t="fft">FFT 格子</span><span id="fftOut">256²</span></div>
    <div class="seg" id="segFFT">
      <button type="button" data-n="64">64</button><button type="button" data-n="128">128</button><button type="button" data-n="256" aria-pressed="true">256</button>
    </div>
  </div>
  <h3 data-t="hView">表示</h3>
  <div class="row">
    <div class="rl"><span data-t="pitch">見下ろす角度</span><span id="pitchOut" data-t="pitchMid">標準</span></div>
    <div class="seg" id="segPitch">
      <button type="button" data-p="55" data-t="pitchLow">浅め</button><button type="button" data-p="65" aria-pressed="true" data-t="pitchMid">標準</button><button type="button" data-p="87" data-t="pitchTop">真上</button>
    </div>
  </div>
  <div class="row">
    <div class="rl"><span data-t="fps">描画速度</span><span id="fps">—</span></div>
  </div>
</div>

<!-- 読み込み中の覆い。シェーダの用意は同期処理で数百ミリ秒かかるので、
     先にこれを描いてから組み立てる。進み具合は刻めないので、脈動だけ出す -->
<div id="loading">
  <div class="card">
    <h1 data-t="title">金魚掬い</h1>
    <div class="bar"><i></i></div>
  </div>
</div>


<script type="module" src="assets/js/main.js?v=202610041317"></script>
</body>
</html>
