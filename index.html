<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金魚掬い</title>
<meta name="description" content="水面を Tessendorf の波スペクトルから GPU 上の FFT で毎フレーム逆変換している、WebGL2 の金魚掬い。">
<meta name="theme-color" content="#e8e2d6">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="assets/css/app.css?v=202610030002">
</head>
<body>

<canvas id="scene"></canvas>

<div id="fallback" hidden>
  <div>
    <h2>WebGL2 が使えません</h2>
    <p class="lede" id="fallbackWhy">この水面は WebGL2 の浮動小数点テクスチャを使って FFT を解いています。別のブラウザか、ハードウェアアクセラレーションを有効にしてお試しください。</p>
  </div>
</div>

<div id="botbar">
  <div id="tools">
    <button id="btnPanel" aria-expanded="false" aria-controls="panel">設定</button>
  </div>
</div>

<div id="panel" hidden>
  <h3>光</h3>
  <div class="row">
    <label class="rl" for="hour"><span>時刻</span><span id="hourOut">14:36</span></label>
    <input type="range" id="hour" min="5.5" max="18.5" step="0.25" value="14.5">
  </div>
  <h3>水面</h3>
  <div class="row">
    <label class="rl" for="amp"><span>波の高さ</span><span id="ampOut">0.55</span></label>
    <input type="range" id="amp" min="0" max="250" step="5" value="55">
  </div>
  <div class="row">
    <label class="rl" for="wind"><span>風速</span><span id="windOut">0.34 m/s</span></label>
    <input type="range" id="wind" min="25" max="150" step="1" value="34">
  </div>
  <div class="row">
    <div class="rl"><span>FFT 格子</span><span id="fftOut">256²</span></div>
    <div class="seg" id="segFFT">
      <button type="button" data-n="64">64</button><button type="button" data-n="128">128</button><button type="button" data-n="256" aria-pressed="true">256</button>
    </div>
  </div>
  <h3>表示</h3>
  <div class="row">
    <div class="rl"><span>見下ろす角度</span><span id="pitchOut">標準</span></div>
    <div class="seg" id="segPitch">
      <button type="button" data-p="55">浅め</button><button type="button" data-p="65" aria-pressed="true">標準</button><button type="button" data-p="87">真上</button>
    </div>
  </div>
  <div class="row">
    <div class="rl"><span>解像度</span><span id="dprOut">標準</span></div>
    <div class="seg" id="segDpr">
      <button type="button" data-d="0.7">軽い</button><button type="button" data-d="1" aria-pressed="true">標準</button><button type="button" data-d="2">精細</button>
    </div>
  </div>
  <div class="row">
    <div class="rl"><span>縁の滑らか化</span><span id="msaaNote">切</span></div>
    <div class="seg" id="segMsaa">
      <button type="button" data-m="0" aria-pressed="true">切</button><button type="button" data-m="1">入</button>
    </div>
  </div>
  <div class="row">
    <div class="rl"><span>描画速度</span><span id="fps">—</span></div>
  </div>
  <div class="row">
  </div>
</div>

<!-- 読み込み中の覆い。シェーダの用意は同期処理で数百ミリ秒かかるので、
     先にこれを描いてから組み立てる。進み具合は刻めないので、脈動だけ出す -->
<div id="loading">
  <div class="card">
    <p class="kicker">夏 の 水 槽</p>
    <h1>金魚掬い</h1>
    <div class="bar"><i></i></div>
  </div>
</div>

<script type="module" src="assets/js/main.js?v=202610030002"></script>
</body>
</html>
